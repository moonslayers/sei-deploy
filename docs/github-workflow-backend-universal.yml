name: Update Backend (Universal)

# Workflow genérico para cualquier backend Laravel
# Llama al endpoint /api/webhook/{backend-name} del servidor sei-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_SERVER_URL: http://tu-servicio.com
  BACKEND_NAME: moonslayers/sagem-backend  # Formato: organizacion/repo-name

jobs:
  update_backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Webhook Payload
        id: prepare
        run: |
          TIMESTAMP=$(date +%s)
          cat > payload.json << EOF
          {
            "timestamp": ${TIMESTAMP}
          }
          EOF
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Sign Payload (usando OpenSSL)
        id: sign
        env:
          PRIVATE_KEY: ${{ secrets.WEBHOOK_PRIVATE_KEY }}
        run: |
          # Decodificar llave privada del secret (viene codificada en base64)
          echo "${PRIVATE_KEY}" | base64 -d > private_key.pem

          # Leer payload
          PAYLOAD=$(cat payload.json)

          # Firmar usando OpenSSL
          SIGNATURE=$(echo -n "${PAYLOAD}" | \
            openssl dgst -sha256 -sign private_key.pem | \
            base64 -w 0)

          # Guardar firma
          echo "signature=${SIGNATURE}" >> $GITHUB_OUTPUT

          # Limpiar llave por seguridad
          rm private_key.pem

      - name: Send Webhook to Deploy Server
        run: |
          PAYLOAD=$(cat payload.json)
          SIGNATURE="${{ steps.sign.outputs.signature }}"

          # Enviar request al backend específico
          RESPONSE=$(curl -X POST "${{ env.DEPLOY_SERVER_URL }}/api/webhook/${{ env.BACKEND_NAME }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: ${SIGNATURE}" \
            -d "${PAYLOAD}" \
            -w "\n%{http_code}" \
            --silent --show-error)

          # Separar código de respuesta del body
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: ${BODY}"
          echo "HTTP Status: ${HTTP_CODE}"

          # Verificar que la respuesta fue exitosa
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Webhook failed with status ${HTTP_CODE}"
            exit 1
          fi

          echo "✅ Backend updated successfully"

      - name: Verify Deployment Status
        run: |
          # Opcional: verificar el estado del despliegue
          RESPONSE=$(curl "${{ env.DEPLOY_SERVER_URL }}/api/status" --silent)
          echo "Current server status:"
          echo "${RESPONSE}" | jq '.'

          # Extraer información específica si es necesario
          BRANCH=$(echo "${RESPONSE}" | jq -r '.data.current_branch')
          echo "Current branch: ${BRANCH}"
