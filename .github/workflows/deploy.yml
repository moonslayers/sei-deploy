name: Deploy to SEI Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SEI_SERVER_URL: https://sei-apps.bajacalifornia.gob.mx/sei

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl

      - name: Prepare Webhook Payload
        id: prepare_payload
        run: |
          TIMESTAMP=$(date +%s)
          cat > payload.json << EOF
          {
            "branch": "${{ github.ref_name }}",
            "timestamp": ${TIMESTAMP},
            "commit": "${{ github.sha }}",
            "repository": "${{ github.repository }}",
            "event": "${{ github.event_name }}"
          }
          EOF

          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Sign Payload with RSA
        id: sign_payload
        run: |
          if [ -z "${{ secrets.WEBHOOK_PRIVATE_KEY }}" ]; then
            echo "WEBHOOK_PRIVATE_KEY no configurado, usando firma simple"
            echo "signature=$(echo -n '{}' | base64 -w 0)" >> $GITHUB_OUTPUT
          else
            echo "${{ secrets.WEBHOOK_PRIVATE_KEY }}" > private_key.pem

            PAYLOAD=$(cat payload.json)

            SIGNATURE=$(php -r "
              \$privateKey = file_get_contents('private_key.pem');
              \$payload = '${PAYLOAD}';
              openssl_sign(\$payload, \$signature, \$privateKey, OPENSSL_ALGO_SHA256);
              echo base64_encode(\$signature);
            ")

            echo "signature=${SIGNATURE}" >> $GITHUB_OUTPUT
            rm private_key.pem
          fi

      - name: Send Webhook to SEI Server
        run: |
          PAYLOAD=$(cat payload.json)
          SIGNATURE="${{ steps.sign_payload.outputs.signature }}"

          curl -X POST "${{ env.SEI_SERVER_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: ${SIGNATURE}" \
            -d "${PAYLOAD}" \
            --silent --show-error --fail-with-body
